<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <rect width="100%" height="100%" fill="#0A0B12"/>
  <rect x="25" y="25" width="550" height="750" rx="20" fill="#121522" stroke="#2B354F" stroke-width="2"/>
  
  <!-- Header Bank -->
  <circle cx="75" cy="80" r="24" fill="#0066AE"/>
  <text x="75" y="87" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFF" text-anchor="middle">BCA</text>
