    <line x1="60" y1="600" x2="540" y2="600" stroke="#1E2638"/>
  </g>

  <!-- Security Footer -->
  <rect x="55" y="635" width="490" height="75" rx="10" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.25)"/>
  <text x="300" y="665" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34D399" text-anchor="middle">STRUK TRANSFER SAH ELEKTRONIK</text>
  <text x="300" y="688" font-family="monospace" font-size="11" fill="#94A3B8" text-anchor="middle">Mercedes-Benz Club Indonesia Official Verification</text>
