  <text x="115" y="98" font-family="monospace" font-size="12" fill="#94A3B8">BCA Mobile Banking Electronic Receipt</text>
  <line x1="50" y1="125" x2="550" y2="125" stroke="#2B354F" stroke-dasharray="6 6"/>

  <!-- Status -->
  <circle cx="300" cy="180" r="28" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="2"/>
  <path d="M290 180 L297 187 L312 172" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="300" y="230" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#34D399" text-anchor="middle">TRANSFER BERHASIL</text>
  <text x="300" y="252" font-family="monospace" font-size="12" fill="#94A3B8" text-anchor="middle">03 Sep 2026 - 21:40:12 WIB</text>

  <!-- Nominal -->
  <rect x="55" y="280" width="490" height="85" rx="12" fill="#090B10" stroke="#252F48"/>
  <text x="80" y="312" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8" text-transform="uppercase" letter-spacing="1">Jumlah Transfer</text>
  <text x="80" y="348" font-family="monospace" font-size="24" font-weight="bold" fill="#FFFFFF">Rp 2.500.000,00</text>

  <!-- Details Table -->
  <g font-family="Arial, sans-serif" font-size="13">
    <text x="60" y="405" fill="#94A3B8">No. Referensi</text>
    <text x="540" y="405" fill="#FFFFFF" font-family="monospace" text-anchor="end">2026090312984401</text>
    <line x1="60" y1="420" x2="540" y2="420" stroke="#1E2638"/>

    <text x="60" y="450" fill="#94A3B8">Rekening Tujuan</text>
    <text x="540" y="450" fill="#FFFFFF" font-family="monospace" text-anchor="end">5410-888-299</text>
    <line x1="60" y1="465" x2="540" y2="465" stroke="#1E2638"/>

    <text x="60" y="495" fill="#94A3B8">Nama Penerima</text>
    <text x="540" y="495" fill="#FFFFFF" font-weight="bold" text-anchor="end">MERCEDES-BENZ CLUB INDO</text>
    <line x1="60" y1="510" x2="540" y2="510" stroke="#1E2638"/>

    <text x="60" y="540" fill="#94A3B8">Pengirim</text>
    <text x="540" y="540" fill="#FFFFFF" font-weight="bold" text-anchor="end">DERIST TOURIANO</text>
    <line x1="60" y1="555" x2="540" y2="555" stroke="#1E2638"/>

    <text x="60" y="585" fill="#94A3B8">Berita / Keterangan</text>
